<!DOCTYPE html>
<html>
<head>
    <title>Cyber Port Scanner</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: #e5e7eb;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #111827;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 30px;
            text-align: center;
        }

        input {
            padding: 10px;
            width: 300px;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            margin-left: 8px;
        }

        button:hover {
            background: #2563eb;
        }

        .card {
            background: #111827;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #1f2937;
        }

        th {
            background: #1f2937;
        }

        .open {
            color: #22c55e;
            font-weight: bold;
        }

        .closed {
            color: #ef4444;
        }

        img {
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #1f2937;
        }

        .download-btn {
            margin-top: 15px;
            background: #10b981;
        }

        .download-btn:hover {
            background: #059669;
        }

        .error {
            color: #ef4444;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="header">
    Cyber Port Scanner Dashboard
</div>

<div class="container">

    <form method="POST">
        <input name="target" placeholder="Enter IP or domain (e.g. 127.0.0.1)" required>
        <button type="submit">Scan</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if ip %}

    <div class="card">
        <h3>Target: {{ ip }}</h3>

        {% if graph %}
            <img src="/static/graph.png" width="320">
        {% endif %}

        {% if results %}
        <table>
            <tr>
                <th>Port</th>
                <th>Service</th>
                <th>Status</th>
            </tr>

            {% for r in results %}
            <tr>
                <td>{{ r.port }}</td>
                <td>{{ r.service }}</td>
                <td class="{{ 'open' if r.status == 'OPEN' else 'closed' }}">
                    {{ r.status }}
                </td>
            </tr>
            {% endfor %}
        </table>
        {% endif %}

        {% if report %}
        <a href="/download">
            <button class="download-btn">⬇ Download Report</button>
        </a>
        {% endif %}

    </div>

    {% endif %}

</div>

</body>
</html>
